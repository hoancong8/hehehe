<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="🎉 Chúc mừng sinh nhật Hoàn — 3D Particle Experience với Three.js">
    <meta name="theme-color" content="#000000">
    <title>Happy Birthday Hoàn 🎉</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Import Map: giúp browser resolve bare specifiers -->
    <script type="importmap">
    {
      "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <style>
        /* ── Reset ─────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Loading Screen ──────────────────────────────────── */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 60%, #1a0030 0%, #000 65%);
            transition: opacity 0.7s ease;
        }

        #loading-content {
            text-align: center;
            padding: 24px;
        }

        #loading-title {
            font-size: clamp(1.4rem, 5vw, 2.4rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ff4fa3 0%, #c77dff 50%, #ff4fa3 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2.4s linear infinite;
            margin-bottom: 36px;
            letter-spacing: 0.04em;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        #loading-bar-wrapper {
            width: min(340px, 78vw);
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin: 0 auto 16px;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4fa3, #c77dff);
            border-radius: 99px;
            transition: width 0.35s ease;
            box-shadow: 0 0 14px #ff4fa3bb;
        }

        #loading-text {
            font-size: clamp(0.75rem, 2vw, 0.88rem);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.06em;
        }

        /* ── Floating particles decoration on loading screen ── */
        #loading-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 79, 163, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(199, 125, 255, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ── Main Button ──────────────────────────────────────── */
        #btn {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 36px;
            font-family: 'Inter', sans-serif;
            font-size: clamp(13px, 2vw, 15px);
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff4fa3 0%, #c77dff 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.2s ease,
                opacity 0.4s ease;
            box-shadow: 0 4px 24px rgba(255, 79, 163, 0.35);
            opacity: 0.35;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            min-width: 160px;
            letter-spacing: 0.03em;
        }

        #btn.ready {
            opacity: 1;
            pointer-events: auto;
            animation: pulse-btn 3s ease-in-out infinite;
        }

        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 4px 24px rgba(255, 79, 163, 0.35); }
            50%       { box-shadow: 0 4px 36px rgba(255, 79, 163, 0.65); }
        }

        #btn:hover {
            transform: translateX(-50%) translateY(-3px) scale(1.04);
            box-shadow: 0 10px 36px rgba(255, 79, 163, 0.55);
            animation: none;
        }

        #btn:active {
            transform: translateX(-50%) translateY(0) scale(0.97);
            box-shadow: 0 2px 14px rgba(255, 79, 163, 0.3);
        }

        /* Ripple overlay */
        #btn-ripple {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #btn-ripple.active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            margin: -150% 0 0 -150%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            animation: ripple-out 0.55s ease-out forwards;
        }

        @keyframes ripple-out {
            from { transform: scale(0); opacity: 1; }
            to   { transform: scale(1);  opacity: 0; }
        }

        /* ── Click Hint ──────────────────────────────────────── */
        #click-hint {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(10px, 1.6vw, 13px);
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.07em;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #click-hint.visible {
            opacity: 0.8;
            pointer-events: auto;
        }

        .heart-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        .heart-title.visible {
            opacity: 1;
            animation: floatTitle 4s ease-in-out infinite alternate;
        }
        .heart-title .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            letter-spacing: 8px;
            color: #ffd1dc;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 209, 220, 0.5);
            display: block;
            margin-bottom: -5px;
        }
        .heart-title .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(50px, 12vw, 90px);
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 153, 204, 0.9), 0 0 30px rgba(255, 153, 204, 0.6), 0 0 50px rgba(255, 153, 204, 0.4);
            line-height: 1.2;
        }
        @keyframes floatTitle {
            0% { transform: translate(-50%, 0); }
            100% { transform: translate(-50%, -10px); }
        }

        /* ── Canvas fills viewport ───────────────────────────── */
        canvas {
            display: block;
            position: fixed;
            inset: 0;
        }
    </style>
</head>

<body>

    <!-- ── Loading Screen ──────────────────────────────────────── -->
    <div id="loading-screen" role="status" aria-label="Đang tải...">
        <div id="loading-content">
            <h1 id="loading-title">✨ Happy Birthday Hoàn</h1>
            <div id="loading-bar-wrapper">
                <div id="loading-bar"></div>
            </div>
            <p id="loading-text">Đang khởi tạo...</p>
        </div>
    </div>

    <!-- ── Main Toggle Button ─────────────────────────────────── -->
    <button id="btn" aria-label="Chuyển đổi chế độ hiển thị">
        <span id="btn-text">Click vào đây</span>
        <div id="btn-ripple" aria-hidden="true"></div>
    </button>

    <!-- ── Click Hint ────────────────────────────────────────── -->
    <p id="click-hint" aria-hidden="true">Click ảnh để phóng to • Click lại để thu nhỏ</p>
    <div id="heart-title" class="heart-title">
        <span class="subtitle">Kỷ Niệm</span><br>
        <span class="main-title">Hoàng & Nhi</span>
    </div>

    <!-- ── App Entry Point ───────────────────────────────────── -->
    <script type="module" src="src/main.js"></script>

</body>

</html>
